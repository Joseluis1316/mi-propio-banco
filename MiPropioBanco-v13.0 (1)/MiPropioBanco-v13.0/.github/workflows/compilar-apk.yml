name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - name: Pruebas automáticas (informativas)
        run: ./gradlew testDebugUnitTest --no-daemon
        continue-on-error: true
      - run: ./gradlew assembleDebug --no-daemon
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiPropioBanco.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiPropioBanco-apk
          path: MiPropioBanco.apk
      - name: Publicar versión (para actualizar desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Mi Propio Banco 2.0.${{ github.run_number }}
          body: Versión compilada automáticamente desde el commit ${{ github.sha }}.
          files: MiPropioBanco.apk
          make_latest: true
